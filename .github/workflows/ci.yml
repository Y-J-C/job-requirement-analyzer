name: 持续集成

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 契约、检查、测试与构建
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: 安装 JavaScript 依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".\apps\api[dev]"

      - name: 验证 API 契约
        run: pnpm api:contract:check

      - name: 运行静态检查
        run: pnpm lint

      - name: 运行类型检查
        run: pnpm typecheck

      - name: 运行单元测试
        run: pnpm test

      - name: 运行生产构建
        run: pnpm build

  infrastructure:
    name: 基础设施集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: 安装 Python 依赖
        run: python -m pip install -e "./apps/api[dev]"

      - name: 启动基础设施
        run: docker compose up -d --wait postgres minio clamav

      - name: 执行数据库迁移
        run: python -m alembic -c apps/api/alembic.ini upgrade head

      - name: 验证 PostgreSQL、MinIO 与文件管线
        env:
          RUN_DATABASE_TESTS: "1"
          RUN_STORAGE_TESTS: "1"
        run: python -m pytest apps/api/tests/integration/test_document_pipeline.py

      - name: 验证 ClamAV 扫描
        env:
          RUN_MALWARE_TESTS: "1"
        run: python -m pytest apps/api/tests/integration/test_clamav_scanning.py

      - name: 输出失败服务日志
        if: failure()
        run: docker compose logs --no-color postgres minio clamav

      - name: 清理基础设施
        if: always()
        run: docker compose down --volumes
