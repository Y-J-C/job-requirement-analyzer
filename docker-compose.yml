name: job-requirement-analyzer

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-job_analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_analyzer_local}
      POSTGRES_DB: ${POSTGRES_DB:-job_analyzer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_analyzer} -d ${POSTGRES_DB:-job_analyzer}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-job_analyzer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-job_analyzer_local}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  clamav:
    image: clamav/clamav:1.4.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-13310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  postgres_data:
  minio_data:
  clamav_data:
